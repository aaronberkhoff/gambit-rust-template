# Docs tooling for the template repo itself — not a Python package, not a maturin build.
# Used to format and lint the markdown files in this repo via `uv sync --group docs`.
[project]
name = "gambit-rust-template"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "black>=23.10.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.18",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-llmstxt>=0.2.0",
    "mdformat>=0.7.17",
    # mdformat-mkdocs>=2.0 includes admonition support — do not also install
    # mdformat-admon, they register conflicting renderers for the same nodes.
    "mdformat-mkdocs>=2.0.4",
    "pre-commit>=4",
    "ruff>=0.9",
]
