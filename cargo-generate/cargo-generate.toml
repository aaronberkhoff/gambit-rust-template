[template]
name = "gambit-rust-template"
description = "Opinionated Rust project template with CI, audit, and release workflows"
# Files copied as-is without Liquid template substitution (binary and asset files).
skip = [
    "docs/assets/Gambit_logo.png",
    "docs/assets/Gambit_logo.svg",
    "docs/assets/favicon.png",
    "docs/assets/favicon.ico",
]

# Files in this list are not copied into the generated project.
ignore = [
    "cargo-generate.toml",
    ".git",
    ".github",
    "template-files",
    "repos.txt",
    "README.md",
]

# project_name removed — cargo-generate provides {{crate_name}} automatically
# from the --name flag (normalized to snake_case), so no separate prompt needed.

[placeholders.description]
type = "string"
prompt = "Short description of the project"

[placeholders.author]
type = "string"
prompt = "Author name (used in Cargo.toml)"
