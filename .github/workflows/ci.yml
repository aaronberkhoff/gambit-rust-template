# CI for the template repo itself — validates that template files are well-formed
# and that cargo-generate scaffolding generates and compiles a project correctly.
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    validate-yaml:
        name: Validate workflow YAML
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install yamllint
              run: pip install yamllint

            - name: Lint workflow files
              run: yamllint -d relaxed .github/workflows/ template-files/.github/workflows/

    validate-toml:
        name: Validate TOML files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install taplo (TOML formatter/validator)
              run: |
                  curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
                      | gzip -d > /usr/local/bin/taplo
                  chmod +x /usr/local/bin/taplo

            - name: Check TOML files
              run: |
                  taplo check template-files/rustfmt.toml
                  taplo check template-files/.clippy.toml
                  taplo check template-files/.cargo/config.toml
                  taplo check cargo-generate/cargo-generate.toml
                  taplo check template-files/deny.toml

    docs-fmt:
        name: Markdown format check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Install docs dependencies
              run: uv sync --group docs

            # --check exits non-zero if any file would be reformatted.
            # Explicit paths avoid scanning .venv/ and installed package docs.
            - name: Check markdown formatting
              run: |
                  uv run mdformat --check \
                      README.md \
                      SETUP.md \
                      cargo-generate/docs/ \
                      template-files/.github/SECURITY.md

    shellcheck:
        name: ShellCheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # ludeeus/action-shellcheck extracts run: blocks from YAML workflow
            # files automatically — shellcheck itself only accepts .sh files.
            - name: Lint shell scripts in workflow files
              uses: ludeeus/action-shellcheck@2.0.0
              with:
                  scandir: ".github/workflows"
                  severity: warning

    test-template:
        name: Test cargo-generate template
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache dependencies
              uses: Swatinem/rust-cache@v2

            - name: Install cargo-binstall
              run: |
                  curl -L --proto '=https' --tlsv1.2 \
                      https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz \
                      | tar xz -C /usr/local/bin

            - name: Install cargo-generate
              # cargo-binstall downloads a prebuilt binary (~5s) instead of
              # compiling cargo-generate from source (~3min).
              run: cargo binstall cargo-generate --no-confirm

            - name: Generate test project
              run: |
                  # Run from /tmp so cargo-generate is not inside the template
                  # repo's Cargo workspace — being inside a workspace causes
                  # cargo-generate to try to register the new crate as a member,
                  # which fails with "No such file or directory".
                  mkdir -p /tmp/generated
                  cd /tmp
                  cargo generate \
                      --path "$GITHUB_WORKSPACE/cargo-generate/" \
                      --name test-project \
                      --define description="test" \
                      --define author="test" \
                      --destination /tmp/generated \
                      --silent

            - name: Cargo check generated project
              working-directory: /tmp/generated/test-project
              run: cargo check
